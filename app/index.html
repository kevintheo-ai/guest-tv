<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Guest TV</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="home">
  <div id="bg" aria-hidden="true"></div>

  <header id="hdr">
    <div class="greeting">
      <h1 id="greeting"></h1>
      <p id="stayinfo"></p>
      <!-- Departure day until 11:00: replaces the stay line, OK opens the check-out list -->
      <button id="checkoutBanner" class="checkout-banner focusable" type="button" hidden>
        <span data-i18n="checkout.today"></span><span class="cb-link" data-i18n="checkout.list"></span>
      </button>
    </div>
    <div class="hdr-right">
      <div id="clock" class="clock"></div>
      <div class="lang-wrap">
        <button id="langToggle" class="lang-toggle focusable" type="button"></button>
        <div id="langMenu" class="lang-menu" hidden></div>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- HOME: row 1 = TV, streaming, gaming (one tile for all consoles, list from the Pi), row 2 = info -->
    <section id="scr-home" class="screen" data-screen="home">
      <div class="row row-big">
        <button class="tile tile-tv focusable" type="button" data-action="launch" data-app="tv">
          <span class="tile-ico"></span>
          <span class="tile-label" data-i18n="tile.tv"></span>
        </button>
        <button class="tile tile-stream b-netflix focusable" type="button" data-action="launch" data-app="netflix">
          <span class="tile-ico"></span><span class="tile-label">Netflix</span>
        </button>
        <button class="tile tile-stream b-prime focusable" type="button" data-action="launch" data-app="prime">
          <span class="tile-ico"></span><span class="tile-label">Prime Video</span>
        </button>
        <button class="tile tile-stream b-disney focusable" type="button" data-action="launch" data-app="disney">
          <span class="tile-ico"></span><span class="tile-label">Disney+</span>
          <span class="tile-sub" data-i18n="tile.disneySub"></span>
        </button>
        <button class="tile tile-stream b-youtube focusable" type="button" data-action="launch" data-app="youtube">
          <span class="tile-ico"></span><span class="tile-label">YouTube</span>
        </button>
        <!-- All consoles share ONE tile; with more than one, a picker asks which -->
        <button id="tileGaming" class="tile tile-stream tile-gaming focusable" type="button" data-app="gaming" hidden>
          <span class="tile-ico"></span><span class="tile-label" data-i18n="tile.gaming"></span>
        </button>
      </div>
      <div class="row row-small">
        <button class="tile focusable" type="button" data-action="screen" data-target="practical">
          <span class="tile-ico"></span><span class="tile-label" data-i18n="tile.practical"></span>
        </button>
        <button class="tile focusable" type="button" data-action="screen" data-target="around">
          <span class="tile-ico"></span><span class="tile-label" data-i18n="tile.around"></span>
        </button>
        <button id="tileBus" class="tile focusable" type="button" data-app="bus">
          <span class="tile-ico"></span><span class="tile-label" data-i18n="tile.bus"></span>
          <span class="tile-sub" id="tileBusSub"></span>
        </button>
        <button class="tile focusable" type="button" data-action="screen" data-target="weather">
          <span class="tile-ico" id="tileWxIco"></span><span class="tile-label" data-i18n="tile.weather"></span>
          <span class="tile-sub" id="tileWxSub"></span>
        </button>
        <button class="tile focusable" type="button" data-action="screen" data-target="help">
          <span class="tile-ico"></span><span class="tile-label" data-i18n="tile.help"></span>
        </button>
        <button class="tile focusable" type="button" data-action="screen" data-target="settings">
          <span class="tile-ico"></span><span class="tile-label" data-i18n="tile.settings"></span>
        </button>
      </div>
    </section>

    <!-- GOOD TO KNOW -->
    <section id="scr-practical" class="screen" data-screen="practical">
      <h2 class="scr-title" data-i18n="practical.title"></h2>
      <div class="cols">
        <div class="panel panel-wlan">
          <h3 data-i18n="practical.wlan"></h3>
          <div class="label" data-i18n="practical.network"></div>
          <div class="wlan-ssid" id="wlanSsid"></div>
          <div class="label" data-i18n="practical.password"></div>
          <div class="wlan-pass" id="wlanPass"></div>
          <div class="qr-row" id="wlanQrRow" hidden>
            <img id="wlanQr" class="qr" alt="">
          </div>
        </div>
        <div class="panel">
          <h3 data-i18n="practical.checkoutTitle"></h3>
          <ul class="list list-check" id="checkoutList"></ul>
        </div>
        <div class="panel">
          <h3 data-i18n="practical.rulesTitle"></h3>
          <ul class="list" id="rulesList"></ul>
        </div>
      </div>
    </section>

    <!-- AROUND YOU -->
    <section id="scr-around" class="screen" data-screen="around">
      <h2 class="scr-title" data-i18n="around.title"></h2>
      <div class="around-rail">
        <div class="cat-list rail" id="catList"></div>
        <div class="rail-body place-grid" id="placeGrid"></div>
      </div>
    </section>

    <!-- WEATHER: rail on the left, content on the right (focusing a rail entry shows its section) -->
    <section id="scr-weather" class="screen" data-screen="weather">
      <h2 class="scr-title" data-i18n="weather.title"></h2>
      <div class="around-rail">
        <div class="cat-list rail" id="wxRail"></div>
        <div class="rail-body">
          <div class="rail-pane wx-pane" data-pane="weather">
            <div class="wx-detail">
              <div class="wx-day" id="wxDay"></div>
              <div class="wx-main"><div class="w-now-ico" id="wIco"></div><div class="w-temp" id="wTemp"></div></div>
              <div class="w-desc" id="wDesc"></div>
              <div class="w-meta" id="wMeta"></div>
              <div class="w-mountain" id="wMountain"></div>
            </div>
            <div class="wx-days" id="weatherDays"></div>
          </div>
          <div class="rail-pane" data-pane="cams" hidden>
            <div class="cam-grid" id="camGrid"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- HELP: rail on the left (contact, emergency & doctor, guest card, video, questions), content on the right -->
    <section id="scr-help" class="screen" data-screen="help">
      <h2 class="scr-title" data-i18n="help.title"></h2>
      <div class="around-rail">
        <div class="cat-list rail" id="helpRail"></div>
        <div class="rail-body">
          <div class="rail-pane panel help-pane help-center" data-pane="contact">
            <div class="help-phone" id="helpPhone"></div>
            <div class="qr-row" id="waQrRow" hidden>
              <img id="waQr" class="qr" alt="">
              <p class="qr-cap">WhatsApp</p>
            </div>
          </div>
          <div class="rail-pane panel help-pane" data-pane="emergency" hidden>
            <div class="sos-grid" id="sosGrid"></div>
            <div class="doc-list" id="docList"></div>
          </div>
          <div class="rail-pane panel help-pane help-center" data-pane="card" hidden>
            <p data-i18n="help.guestcardBody"></p>
            <div class="qr-row" id="cardQrRow" hidden>
              <img id="cardQr" class="qr" alt="">
              <p class="qr-cap"><span id="cardLabel" class="qr-url"></span></p>
            </div>
          </div>
          <div class="rail-pane panel help-pane help-center" data-pane="video" hidden>
            <div class="qr-row" id="videoQrRow" hidden>
              <img id="videoQr" class="qr qr-big" alt="">
            </div>
            <p class="qr-url" id="videoUrl" hidden></p>
          </div>
          <div class="rail-pane panel help-pane panel-faq" data-pane="faq" hidden>
            <div class="faq-list" id="faqList"></div>
            <div class="faq-answer" id="faqAnswer">
              <p id="faqText"></p>
              <img id="faqQr" class="qr qr-small" alt="" hidden>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- SETTINGS -->
    <section id="scr-settings" class="screen" data-screen="settings">
      <h2 class="scr-title" data-i18n="settings.title"></h2>
      <div class="settings-list" id="settingsList"></div>
    </section>

    <!-- VACANT (no guest) -->
    <section id="scr-vacant" class="screen" data-screen="vacant">
      <div class="vacant-wrap">
        <h2 class="vacant-title" data-i18n="vacant.title"></h2>
        <p class="vacant-hint" data-i18n="vacant.hint"></p>
      </div>
    </section>
  </main>

  <!-- Detail view (place, console picker, large webcam): focus stays inside, Back closes it -->
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="offlineBadge" class="offline-badge" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="screensaver" class="screensaver">
    <div class="ss-photo" id="ssPhoto"></div>
    <div class="ss-box" id="ssBox">
      <div class="ss-clock" id="ssClock"></div>
      <div class="ss-date" id="ssDate"></div>
      <div class="ss-weather" id="ssWeather"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/lib/webOSTV.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/luna.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/data.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
